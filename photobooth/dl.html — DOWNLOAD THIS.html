<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your SnapBooth Photo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff}
img{max-width:100%;max-height:55vh;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.4);display:none}
h2{font-size:22px}
p{color:#b8c5d6;font-size:14px;text-align:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .2s;color:#fff}
.dl{background:#6c5ce7}.dl:active{background:#5a4bd1}
.sh{background:#fd79a8}.sh:active{background:#e84393}
.acts{display:none;gap:10px;flex-wrap:wrap;justify-content:center}
.note{color:#7f8c9b;font-size:11px;margin-top:8px;text-align:center;max-width:320px}
.spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.2);border-top-color:#6c5ce7;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#err{color:#ff8a8a;display:none}
</style>
</head>
<body>
<div style="font-size:46px">📸</div>
<h2>Your SnapBooth Photo</h2>
<div id="loader" class="spin"></div>
<p id="desc">Loading your photo…</p>
<img id="photo">
<div class="acts" id="acts">
  <a class="btn dl" id="saveBtn">💾 Save Photo</a>
  <button class="btn sh" id="shareBtn" style="display:none" onclick="sharePhoto()">📤 Share</button>
</div>
<p id="err"></p>
<p class="note" id="footnote" style="display:none">If Save opens the photo in a new tab, long-press it and choose “Download image”.</p>
<script>
var IMG_URL='';
(function(){
  try{
    var params=new URLSearchParams(window.location.search);
    IMG_URL=params.get('img')||'';
    if(!IMG_URL){showError('No photo found in this link. Ask the booth to share again.');return;}
    var img=document.getElementById('photo');
    img.onload=function(){
      hideLoader();
      img.style.display='block';
      document.getElementById('acts').style.display='flex';
      document.getElementById('desc').textContent='Tap Save Photo to download.';
      document.getElementById('footnote').style.display='block';
      var saveBtn=document.getElementById('saveBtn');
      saveBtn.href=IMG_URL;
      saveBtn.setAttribute('download','snapbooth_photo.jpg');
      saveBtn.addEventListener('click',function(e){e.preventDefault();saveImage();});
      if(navigator.share)document.getElementById('shareBtn').style.display='';
    };
    img.onerror=function(){
      hideLoader();
      /* Image couldn't be shown inline — still give a direct open link */
      document.getElementById('desc').textContent='';
      var acts=document.getElementById('acts');acts.style.display='flex';
      var saveBtn=document.getElementById('saveBtn');
      saveBtn.href=IMG_URL;saveBtn.target='_blank';saveBtn.textContent='📷 Open Photo';
      var fn=document.getElementById('footnote');
      fn.textContent='Tap to open your photo, then long-press to save it.';
      fn.style.display='block';
    };
    img.src=IMG_URL;
  }catch(e){showError('Something went wrong loading your photo.');}
})();

function hideLoader(){var l=document.getElementById('loader');if(l)l.style.display='none';}

function saveImage(){
  try{
    fetch(IMG_URL,{mode:'cors'})
      .then(function(r){return r.blob();})
      .then(function(blob){
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');
        a.href=url;a.download='snapbooth_photo.jpg';a.style.display='none';
        document.body.appendChild(a);a.click();
        setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},800);
      })
      .catch(function(){window.open(IMG_URL,'_blank');});
  }catch(e){window.open(IMG_URL,'_blank');}
}

function sharePhoto(){
  try{
    if(navigator.share){
      fetch(IMG_URL,{mode:'cors'})
        .then(function(r){return r.blob();})
        .then(function(blob){
          var f=new File([blob],'snapbooth_photo.jpg',{type:blob.type||'image/jpeg'});
          if(navigator.canShare&&navigator.canShare({files:[f]})){
            return navigator.share({files:[f],title:'SnapBooth Photo'});
          }
          return navigator.share({title:'SnapBooth Photo',url:IMG_URL});
        })
        .catch(function(){
          navigator.share({title:'SnapBooth Photo',url:IMG_URL}).catch(function(){});
        });
    }
  }catch(e){}
}
</script>


</body></html>
