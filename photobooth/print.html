<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print photo</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;min-height:100vh;box-sizing:border-box}
img{max-width:100%;max-height:58vh;background:#fff;border-radius:8px}
button{width:100%;max-width:420px;padding:18px;font-size:19px;font-weight:700;border:none;border-radius:14px;color:#fff}
.p{background:#6c5ce7}.c{background:#444}
p{color:#bbb;font-size:14px;text-align:center;margin:0;max-width:420px}
#err{color:#ff8a8a;display:none}
</style></head><body>
<img id="im" alt="">
<button class="p" id="go">&#x1f5a8;&#xfe0f; Send to printer app</button>
<button class="c" id="cl">&#x2715; Back to booth</button>
<p id="hint">After printing, tap Back to booth (or close this tab).</p>
<p id="err"></p>
<script>
window.onerror=function(){return true};
(function(){
  var du=null;
  try{du=localStorage.getItem('snapbooth_print')}catch(e){}
  var im=document.getElementById('im'),err=document.getElementById('err');
  if(!du){err.style.display='block';err.textContent='Photo not found. Go back to the booth and tap Print again.';}
  else{im.src=du}
  function toFile(){
    var a=du.split(','),m=(a[0].match(/:(.*?);/)||[])[1]||'image/jpeg',b=atob(a[1]),u=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    return new File([u],'snapbooth_print.'+(/png/.test(m)?'png':'jpg'),{type:m});
  }
  var f=null;try{if(du)f=toFile()}catch(e){}
  document.getElementById('go').onclick=function(){
    try{
      if(f&&navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){navigator.share({files:[f]}).catch(function(){})}
      else{window.print()}
    }catch(e){try{window.print()}catch(e2){}}
  };
  document.getElementById('cl').onclick=function(){
    var standalone=false;try{standalone=!!navigator.standalone||matchMedia('(display-mode: standalone)').matches}catch(e){}
    if(!standalone){try{window.close()}catch(e){}}
    setTimeout(function(){location.href='index.html?back=1'},250);
  };
})();
</script>
</body></html>
