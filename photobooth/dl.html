<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your SnapBooth Photo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff}
img{max-width:100%;max-height:50vh;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.4);display:none}
h2{font-size:22px}
p{color:#b8c5d6;font-size:14px;text-align:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .2s;color:#fff}
.dl{background:#6c5ce7}.dl:hover{background:#5a4bd1}
.sh{background:#fd79a8}.sh:hover{background:#e84393}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;display:none}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.2);border-top-color:#6c5ce7;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{color:#7f8c9b;font-size:11px;margin-top:8px;text-align:center;max-width:300px}
#err{color:#d63031;display:none}
</style>
</head>
<body>
<div style="font-size:48px">📸</div>
<h2 id="title">Your SnapBooth Photo</h2>
<p id="desc"><span class="spinner" style="display:inline-block;vertical-align:middle;width:20px;height:20px;border-width:3px;margin-right:8px"></span> Loading your photo...</p>
<img id="photo">
<div class="acts" id="acts">
  <a class="btn dl" id="saveBtn">💾 Save Photo</a>
  <button class="btn sh" id="shareBtn" style="display:none" onclick="sharePhoto()">📤 Share</button>
</div>
<p id="err"></p>
<p class="note" id="footnote" style="display:none">Long-press the photo to save, or tap "Save Photo" below.</p>
<script>
(function(){
  try{
    var params = new URLSearchParams(window.location.search);
    var imgUrl = params.get('img');
    
    /* Also check hash for legacy base64 approach */
    var hash = window.location.hash;

    if(imgUrl){
      /* New approach: img parameter contains direct image URL from ImgBB */
      loadFromUrl(imgUrl);
    } else if(hash && hash.length > 10){
      /* Legacy: base64 in hash */
      loadFromHash(hash);
    } else {
      showError('No photo found in this link. Ask the booth operator to share again.');
    }
  }catch(e){
    showError('Something went wrong loading your photo.');
  }

  function loadFromUrl(url){
    var img = document.getElementById('photo');
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      img.style.display = 'block';
      document.getElementById('acts').style.display = 'flex';
      document.getElementById('desc').textContent = 'Tap "Save Photo" to download!';
      document.getElementById('footnote').style.display = 'block';
      /* For the save button, link directly to the image */
      var saveBtn = document.getElementById('saveBtn');
      saveBtn.href = url;
      saveBtn.download = 'snapbooth_photo.jpg';
      saveBtn.target = '_blank';
      /* If download attribute doesn't trigger (cross-origin), use click handler */
      saveBtn.addEventListener('click', function(e){
        e.preventDefault();
        downloadViaFetch(url);
      });
      /* Show share button if supported */
      if(navigator.share) document.getElementById('shareBtn').style.display = '';
    };
    img.onerror = function(){
      /* Fallback: open image directly */
      showError('Could not preview the photo. <a href="'+url+'" target="_blank" style="color:#6c5ce7;text-decoration:underline">Tap here to open it directly</a>.');
    };
    img.src = url;
  }

  function downloadViaFetch(url){
    try{
      fetch(url)
        .then(function(r){return r.blob()})
        .then(function(blob){
          var blobUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = blobUrl;
          a.download = 'snapbooth_photo.jpg';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(function(){
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
          }, 500);
        })
        .catch(function(){
          /* If fetch fails (CORS), open in new tab */
          window.open(url, '_blank');
        });
    }catch(e){
      window.open(url, '_blank');
    }
  }

  function loadFromHash(hash){
    var safe = hash.substring(1);
    var std = safe.replace(/-/g,'+').replace(/_/g,'/');
    while(std.length%4!==0)std+='=';
    var dataUrl = 'data:image/jpeg;base64,' + std;
    var img = document.getElementById('photo');
    img.onload = function(){
      img.style.display = 'block';
      document.getElementById('acts').style.display = 'flex';
      document.getElementById('desc').textContent = 'Tap "Save Photo" to download!';
      document.getElementById('footnote').style.display = 'block';
      document.getElementById('saveBtn').href = dataUrl;
      document.getElementById('saveBtn').download = 'snapbooth_photo.jpg';
      if(navigator.share) document.getElementById('shareBtn').style.display = '';
    };
    img.onerror = function(){
      showError('Could not load photo. The link may be corrupted.');
    };
    img.src = dataUrl;
  }

  function showError(msg){
    document.getElementById('desc').textContent = '';
    var err = document.getElementById('err');
    err.innerHTML = msg;
    err.style.display = 'block';
  }
})();

function sharePhoto(){
  try{
    var img = document.getElementById('photo');
    var c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    c.toBlob(function(blob){
      var f = new File([blob], 'snapbooth_photo.jpg', {type:'image/jpeg'});
      navigator.share({files:[f], title:'SnapBooth Photo'}).catch(function(){});
    }, 'image/jpeg');
  }catch(e){}
}
</script>
</body>
</html>
